<!doctype html><html><head><meta charset="utf-8">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oxygen', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Monaco, 'Inconsolata', 'Fira Code', monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:20px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}
  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px;margin-right:4px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-family:var(--sans);font-size:11px;font-weight:500;border:1px solid transparent;letter-spacing:-0.005em}
  .chip{border-radius:9999px;padding:4px 13px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600}
  [data-lucide]{width:11px;height:11px;stroke-width:2.2}

  /* ───── DARK ───── */
  .dark .b-brand{
    background:linear-gradient(180deg,#14E3CE 0%,#00B8A0 100%);
    color:#001B17;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 0 12px rgba(0,209,193,0.4);
  }
  .dark .b-accent{
    background:linear-gradient(180deg,#14221F 0%,#0A1A18 100%);
    color:#E2BC57;border-color:#2A2414;
    box-shadow:inset 0 1px 0 rgba(226,188,87,0.1),0 0 10px rgba(226,188,87,0.18);
  }
  .dark .b-outline{
    background:linear-gradient(180deg,rgba(234,244,241,0.04) 0%,rgba(234,244,241,0) 100%);
    border-color:#1B302C;color:#EAF4F1;
    box-shadow:inset 0 1px 0 rgba(234,244,241,0.06);
  }
  .dark .b-risk{background:linear-gradient(180deg,rgba(240,133,133,0.2) 0%,rgba(217,107,107,0.12) 100%);color:#F08585;border-color:rgba(217,107,107,0.3);box-shadow:inset 0 1px 0 rgba(240,133,133,0.15),0 0 10px rgba(217,107,107,0.2)}
  .dark .b-warn{background:linear-gradient(180deg,rgba(226,188,87,0.2) 0%,rgba(226,188,87,0.1) 100%);color:#E2BC57;border-color:rgba(226,188,87,0.3);box-shadow:inset 0 1px 0 rgba(226,188,87,0.15),0 0 10px rgba(226,188,87,0.2)}
  .dark .b-ok{background:linear-gradient(180deg,rgba(52,217,139,0.2) 0%,rgba(52,217,139,0.1) 100%);color:#34D98B;border-color:rgba(52,217,139,0.3);box-shadow:inset 0 1px 0 rgba(52,217,139,0.15),0 0 10px rgba(52,217,139,0.2)}
  .dark .b-muted{background:linear-gradient(180deg,#0E1F1C 0%,#061311 100%);color:#8FB3AC;border-color:#132421}
  .dark .chip{
    background:linear-gradient(135deg,#14E3CE 0%,#00B8A0 50%,#34D98B 100%);
    color:#001B17;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 0 0 1px rgba(0,209,193,0.45),
      0 0 16px rgba(0,209,193,0.5),
      0 3px 14px rgba(0,184,160,0.35);
  }

  /* ───── LIGHT ───── */
  .light .b-brand{
    background:linear-gradient(180deg,#00B8A0 0%,#00806F 100%);
    color:#fff;font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 2px 8px rgba(0,128,111,0.25);
  }
  .light .b-accent{
    background:linear-gradient(180deg,#FCF2DE 0%,#F4E6C6 100%);
    color:#8C5A1F;border-color:#E8D9B8;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6),0 1px 3px rgba(140,90,31,0.1)}
  .light .b-outline{
    background:#fff;border-color:#DAD3C7;color:#0F2420;
    box-shadow:0 1px 2px rgba(15,36,32,0.05);
  }
  .light .b-risk{background:linear-gradient(180deg,#FDEDED 0%,#FBE5E5 100%);color:#A84040;border-color:#E8C2C2;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5)}
  .light .b-warn{background:linear-gradient(180deg,#FDF6E3 0%,#FBF1DA 100%);color:#8C5A1F;border-color:#E8D9B8;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6)}
  .light .b-ok{background:linear-gradient(180deg,#E5F7EB 0%,#D9F2E3 100%);color:#1E7A4C;border-color:#B3E0C4;box-shadow:inset 0 1px 0 rgba(255,255,255,0.6)}
  .light .b-muted{background:linear-gradient(180deg,#F0F7F4 0%,#EAF4F1 100%);color:#7A8C88;border-color:#DAD3C7}
  .light .chip{
    background:linear-gradient(135deg,#00B8A0 0%,#00806F 60%,#2DA069 100%);
    color:#fff;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      0 0 0 1px rgba(0,128,111,0.35),
      0 3px 12px rgba(0,184,160,0.35),
      0 6px 20px rgba(0,128,111,0.22);
  }
</style></head>
<body>

<div class="row dark">
  <span class="tag">Dark</span>
  <span class="badge b-brand"><i data-lucide="shield-check"></i>Privacy-First</span>
  <span class="badge b-accent"><i data-lucide="sparkles"></i>AI-Powered</span>
  <span class="badge b-outline">Engineering (8)</span>
  <span class="badge b-risk">Overloaded</span>
  <span class="badge b-warn">Medium risk</span>
  <span class="badge b-ok">Balanced</span>
  <span class="badge b-muted">Declining</span>
  <span class="chip">Connected<i data-lucide="check-circle"></i></span>
</div>

<div class="row light">
  <span class="tag">Light</span>
  <span class="badge b-brand"><i data-lucide="shield-check"></i>Privacy-First</span>
  <span class="badge b-accent"><i data-lucide="sparkles"></i>AI-Powered</span>
  <span class="badge b-outline">Engineering (8)</span>
  <span class="badge b-risk">Overloaded</span>
  <span class="badge b-warn">Medium risk</span>
  <span class="badge b-ok">Balanced</span>
  <span class="badge b-muted">Declining</span>
  <span class="chip">Connected<i data-lucide="check-circle"></i></span>
</div>
<script>lucide.createIcons()</script>
</body></html>
