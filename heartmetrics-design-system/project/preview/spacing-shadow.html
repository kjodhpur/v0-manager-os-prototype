<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oxygen', 'Ubuntu', 'Cantarell', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Monaco, 'Inconsolata', 'Fira Code', monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:22px 24px;display:flex;gap:18px;align-items:center}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}

  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px;flex-shrink:0;align-self:flex-start;margin-top:14px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .chip{width:92px;height:56px;border-radius:10px}
  .dark .chip{background:#07110F;border:1px solid #132421}
  .light .chip{background:#fff;border:1px solid #DAD3C7}
  .lbl{font-family:var(--mono);font-size:10px;line-height:1.25;text-align:center}
  .dark .lbl{color:#8FB3AC}
  .light .lbl{color:#7A8C88}
  .lbl b{font-weight:600}

  /* Dark shadows — teal-tinted */
  .d-sm{box-shadow:0 1px 4px rgba(0,184,160,0.18)}
  .d-md{box-shadow:0 2px 12px rgba(0,184,160,0.28)}
  .d-lg{box-shadow:0 8px 24px rgba(0,184,160,0.32)}
  .d-glow{box-shadow:0 0 20px rgba(0,184,160,0.45), 0 0 40px rgba(0,184,160,0.25);background:linear-gradient(135deg,#00D1C1,#34D98B)!important;border-color:transparent!important}
  .d-amber{box-shadow:0 0 18px rgba(226,188,87,0.5), 0 0 36px rgba(226,188,87,0.25);background:linear-gradient(135deg,#E2BC57,#E29046)!important;border-color:transparent!important}

  /* Light shadows — softer */
  .l-sm{box-shadow:0 1px 3px rgba(15,36,32,0.06)}
  .l-md{box-shadow:0 2px 10px rgba(0,128,111,0.12)}
  .l-lg{box-shadow:0 8px 24px rgba(0,128,111,0.18)}
  .l-glow{box-shadow:0 0 16px rgba(0,184,160,0.35), 0 4px 20px rgba(0,128,111,0.22);background:linear-gradient(135deg,#00B8A0,#2DA069)!important;border-color:transparent!important}
  .l-amber{box-shadow:0 0 14px rgba(214,174,74,0.4), 0 4px 20px rgba(198,154,62,0.25);background:linear-gradient(135deg,#D6AE4A,#C69A3E)!important;border-color:transparent!important}
</style></head>
<body>

<div class="row dark">
  <div class="tag">Dark</div>
  <div class="item"><div class="chip d-sm"></div><div class="lbl"><b>sm</b><br/>subtle</div></div>
  <div class="item"><div class="chip d-md"></div><div class="lbl"><b>md</b><br/>card</div></div>
  <div class="item"><div class="chip d-lg"></div><div class="lbl"><b>lg</b><br/>modal</div></div>
  <div class="item"><div class="chip d-glow"></div><div class="lbl"><b>glow-primary</b><br/>CTA teal</div></div>
  <div class="item"><div class="chip d-amber"></div><div class="lbl"><b>glow-accent</b><br/>CTA amber</div></div>
</div>

<div class="row light">
  <div class="tag">Light</div>
  <div class="item"><div class="chip l-sm"></div><div class="lbl"><b>sm</b><br/>subtle</div></div>
  <div class="item"><div class="chip l-md"></div><div class="lbl"><b>md</b><br/>card</div></div>
  <div class="item"><div class="chip l-lg"></div><div class="lbl"><b>lg</b><br/>modal</div></div>
  <div class="item"><div class="chip l-glow"></div><div class="lbl"><b>glow-primary</b><br/>CTA teal</div></div>
  <div class="item"><div class="chip l-amber"></div><div class="lbl"><b>glow-accent</b><br/>CTA amber</div></div>
</div>

</body></html>
