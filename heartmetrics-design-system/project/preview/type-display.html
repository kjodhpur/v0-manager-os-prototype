<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oxygen', 'Ubuntu', 'Cantarell', 'Helvetica Neue', sans-serif;
    --serif: Georgia, 'Palatino', 'Times New Roman', serif;
    --mono: 'SF Mono', Monaco, 'Inconsolata', 'Fira Code', monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:22px 26px;display:flex;align-items:flex-start;gap:16px}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}

  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:3px 9px;border-radius:4px;flex-shrink:0;margin-top:8px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .hero{font-family:var(--serif);font-weight:700;font-size:42px;line-height:0.98;letter-spacing:-0.02em;flex:1}
  .g{
    background:linear-gradient(90deg,#00D1C1 0%,#34D98B 28%,#8EDB52 52%,#E4D34A 76%,#E2BC57 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .dark .g{filter:drop-shadow(0 0 20px rgba(0,209,193,0.25))}

  .meta{font-family:var(--mono);font-size:10px;margin-top:12px}
  .dark .meta{color:#6B8A84}
  .light .meta{color:#7A8C88}
</style></head>
<body>

<div class="row dark">
  <div class="tag">Dark</div>
  <div>
    <div class="hero"><div>See your team's</div><div class="g">real story</div></div>
    <div class="meta">Georgia · 700 · ls −0.02em · logo gradient fill</div>
  </div>
</div>

<div class="row light">
  <div class="tag">Light</div>
  <div>
    <div class="hero"><div>See your team's</div><div class="g">real story</div></div>
    <div class="meta">Same stack · gradient identical to wordmark</div>
  </div>
</div>

</body></html>
