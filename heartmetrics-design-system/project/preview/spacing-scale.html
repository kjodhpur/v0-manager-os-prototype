<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oxygen', 'Ubuntu', 'Cantarell', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Monaco, 'Inconsolata', 'Fira Code', monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:18px 22px;position:relative}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}

  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px;margin-bottom:10px;display:inline-block}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .items{display:flex;gap:14px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:4px}
  .bar{background:linear-gradient(180deg,#00D1C1 0%,#34D98B 100%);border-radius:2px}
  .light .bar{background:linear-gradient(180deg,#00B8A0 0%,#2DA069 100%)}
  .lbl{font-family:var(--mono);font-size:10px}
  .dark .lbl{color:#8FB3AC}
  .light .lbl{color:#7A8C88}
</style></head>
<body>

<div class="row dark">
  <div class="tag">Dark · 4px grid</div>
  <div class="items">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="lbl">4</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="lbl">8</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="lbl">12</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="lbl">16</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="lbl">24</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="lbl">32</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="lbl">48</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="lbl">64</div></div>
  </div>
</div>

<div class="row light">
  <div class="tag">Light · 4px grid</div>
  <div class="items">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="lbl">4</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="lbl">8</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="lbl">12</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="lbl">16</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="lbl">24</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="lbl">32</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="lbl">48</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="lbl">64</div></div>
  </div>
</div>

</body></html>
