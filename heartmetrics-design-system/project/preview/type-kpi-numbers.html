<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', Monaco, monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:18px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;align-items:stretch}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}
  .tag{position:absolute;top:6px;left:22px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .kpi{border-radius:10px;padding:14px;margin-top:14px;display:flex;flex-direction:column;justify-content:space-between}
  .dark .kpi{border:1px solid #132421;background:#050D0C}
  .light .kpi{border:1px solid #DAD3C7;background:#fff}

  .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
  .dark .lbl{color:#8FB3AC}
  .light .lbl{color:#7A8C88}

  .num{font-family:var(--sans);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.025em;line-height:1;margin-top:8px;display:flex;align-items:baseline;gap:6px}
  .delta{font-size:12px;font-weight:600}
  .dark .up{color:#34D98B}
  .dark .down{color:#D96B6B}
  .light .up{color:#2DA069}
  .light .down{color:#C85858}

  .sub{font-size:11px;margin-top:6px}
  .dark .sub{color:#6B8A84}
  .light .sub{color:#7A8C88}
  .sub.warn{color:#E2BC57}
  .light .sub.warn{color:#A67A1E}

  .kpi.brand .num{
    background:linear-gradient(90deg,#00D1C1 0%,#34D98B 60%,#8EDB52 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .dark .kpi.brand{box-shadow:0 0 22px rgba(0,184,160,0.12)}
  .light .kpi.brand .num{
    background:linear-gradient(90deg,#00806F 0%,#2DA069 60%,#82C945 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
</style></head>
<body>

<div class="row dark">
  <span class="tag">Dark</span>
  <div class="kpi brand"><div><div class="lbl">Team WHI</div><div class="num">62 <span class="delta up">▲ +3</span></div></div><div class="sub">Work Happiness Index · 4 wk</div></div>
  <div class="kpi"><div><div class="lbl">At-risk</div><div class="num">3</div></div><div class="sub warn">Need attention</div></div>
  <div class="kpi"><div><div class="lbl">Fairness</div><div class="num">71 <span class="delta down">▼ −4</span></div></div><div class="sub">Confidence: high</div></div>
</div>

<div class="row light">
  <span class="tag">Light</span>
  <div class="kpi brand"><div><div class="lbl">Team WHI</div><div class="num">62 <span class="delta up">▲ +3</span></div></div><div class="sub">Work Happiness Index · 4 wk</div></div>
  <div class="kpi"><div><div class="lbl">At-risk</div><div class="num">3</div></div><div class="sub warn">Need attention</div></div>
  <div class="kpi"><div><div class="lbl">Fairness</div><div class="num">71 <span class="delta down">▼ −4</span></div></div><div class="sub">Confidence: high</div></div>
</div>

</body></html>
