<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Oxygen', 'Ubuntu', 'Cantarell', 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', Monaco, 'Inconsolata', 'Fira Code', monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:18px 22px}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}

  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px;margin-bottom:12px;display:inline-block}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .items{display:flex;gap:14px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:6px}
  .block{width:64px;height:64px;background:linear-gradient(135deg,#00D1C1 0%,#34D98B 100%)}
  .light .block{background:linear-gradient(135deg,#00B8A0 0%,#2DA069 100%)}
  .lbl{font-family:var(--mono);font-size:10px;text-align:center;line-height:1.2}
  .dark .lbl{color:#8FB3AC}
  .light .lbl{color:#7A8C88}
  .lbl b{color:inherit;font-weight:600}
</style></head>
<body>

<div class="row dark">
  <div class="tag">Dark · radii</div>
  <div class="items">
    <div class="item"><div class="block" style="border-radius:0"></div><div class="lbl"><b>sharp</b><br/>0</div></div>
    <div class="item"><div class="block" style="border-radius:4px"></div><div class="lbl"><b>sm</b><br/>4</div></div>
    <div class="item"><div class="block" style="border-radius:6px"></div><div class="lbl"><b>md</b><br/>6</div></div>
    <div class="item"><div class="block" style="border-radius:10px"></div><div class="lbl"><b>lg</b><br/>10</div></div>
    <div class="item"><div class="block" style="border-radius:12px"></div><div class="lbl"><b>xl · card</b><br/>12</div></div>
    <div class="item"><div class="block" style="border-radius:16px"></div><div class="lbl"><b>2xl</b><br/>16</div></div>
    <div class="item"><div class="block" style="border-radius:9999px"></div><div class="lbl"><b>pill</b><br/>∞</div></div>
  </div>
</div>

<div class="row light">
  <div class="tag">Light · radii</div>
  <div class="items">
    <div class="item"><div class="block" style="border-radius:0"></div><div class="lbl"><b>sharp</b><br/>0</div></div>
    <div class="item"><div class="block" style="border-radius:4px"></div><div class="lbl"><b>sm</b><br/>4</div></div>
    <div class="item"><div class="block" style="border-radius:6px"></div><div class="lbl"><b>md</b><br/>6</div></div>
    <div class="item"><div class="block" style="border-radius:10px"></div><div class="lbl"><b>lg</b><br/>10</div></div>
    <div class="item"><div class="block" style="border-radius:12px"></div><div class="lbl"><b>xl · card</b><br/>12</div></div>
    <div class="item"><div class="block" style="border-radius:16px"></div><div class="lbl"><b>2xl</b><br/>16</div></div>
    <div class="item"><div class="block" style="border-radius:9999px"></div><div class="lbl"><b>pill</b><br/>∞</div></div>
  </div>
</div>

</body></html>
