<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans)}
  .row{padding:18px 22px}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}
  .label{font-size:10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.1em;font-family:var(--font-mono);display:flex;align-items:center;gap:10px}
  .label::after{content:'';flex:1;height:1px}
  .dark .label{color:#8FB3AC}
  .dark .label::after{background:linear-gradient(90deg,#132421 0%,transparent 100%)}
  .light .label{color:#7A8C88}
  .light .label::after{background:linear-gradient(90deg,#DAD3C7 0%,transparent 100%)}
  .ramp{display:flex;border-radius:10px;overflow:hidden;height:48px}
  .dark .ramp{border:1px solid #132421;box-shadow:0 0 24px rgba(0,209,193,0.15)}
  .light .ramp{border:1px solid #DAD3C7}
  .step{flex:1;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px 8px;position:relative}
  .step span{font-size:10px;font-family:var(--font-mono);font-weight:600;letter-spacing:0.02em}
  .legend{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;font-family:var(--font-mono)}
  .dark .legend{color:#6B8A84}
  .light .legend{color:#7A8C88}
</style></head>
<body>

<div class="row dark">
  <div class="label">WHI ramp · dark</div>
  <div class="ramp">
    <div class="step" style="background:#00D1C1"><span style="color:#003833">W1</span></div>
    <div class="step" style="background:#34D98B"><span style="color:#0D3A23">W2</span></div>
    <div class="step" style="background:#8EDB52"><span style="color:#2A4012">W3</span></div>
    <div class="step" style="background:#E4D34A"><span style="color:#3D3709">W4</span></div>
    <div class="step" style="background:#E2BC57"><span style="color:#3D2F0A">W5</span></div>
    <div class="step" style="background:#E29046"><span style="color:#3D1F07">W6</span></div>
    <div class="step" style="background:#D96B6B"><span style="color:#fff">W7</span></div>
  </div>
  <div class="legend"><span>Healthy · 85+</span><span>At-risk · &lt;45</span></div>
</div>

<div class="row light">
  <div class="label">WHI ramp · light</div>
  <div class="ramp">
    <div class="step" style="background:#00B8A0"><span style="color:#fff">W1</span></div>
    <div class="step" style="background:#2DC178"><span style="color:#fff">W2</span></div>
    <div class="step" style="background:#82C945"><span style="color:#263A08">W3</span></div>
    <div class="step" style="background:#D8C03E"><span style="color:#3D3709">W4</span></div>
    <div class="step" style="background:#D6AE4A"><span style="color:#3D2F0A">W5</span></div>
    <div class="step" style="background:#D6853A"><span style="color:#fff">W6</span></div>
    <div class="step" style="background:#C85858"><span style="color:#fff">W7</span></div>
  </div>
  <div class="legend"><span>Healthy · 85+</span><span>At-risk · &lt;45</span></div>
</div>

</body></html>
