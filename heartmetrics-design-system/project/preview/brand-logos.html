<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;color:#F8FAFC;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .card{padding:32px 40px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .mark-wrap{height:96px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 8px 24px rgba(0,184,160,0.25))}
  .mark-wrap img{height:96px;width:auto;display:block}
  .wordmark{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 64px;
    letter-spacing: -0.01em;
    line-height: 1;
    background: linear-gradient(90deg, #00D1C1 0%, #34D98B 28%, #8EDB52 52%, #E4D34A 76%, #E2BC57 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .lbl{font-size:11px;color:#8B8B8B;text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
</style></head>
<body><div class="card">
  <div class="col">
    <div class="mark-wrap">
      <img src="../assets/hm-logo-icon.svg" alt="heartmetrics icon"/>
    </div>
    <div class="lbl">Icon mark</div>
  </div>
  <div class="col">
    <div class="wordmark">heartmetrics</div>
    <div class="lbl">Wordmark · Georgia 700</div>
  </div>
</div></body></html>
