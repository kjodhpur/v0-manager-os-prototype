<!doctype html><html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#000;color:#F8FAFC;font-family:var(--font-sans)}
  .card{padding:24px;min-height:100%;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .swatch{border-radius:12px;overflow:hidden;border:1px solid #1A1A1A;flex:1;min-width:140px;display:flex;flex-direction:column}
  .swatch .chip{height:64px}
  .swatch .meta{padding:8px 10px;background:#000}
  .swatch .name{font-size:12px;font-weight:600}
  .swatch .hex{font-family:var(--font-mono);font-size:11px;color:#8B8B8B}
</style></head>
<body><div class="card">
<div class="row">
  <div class="swatch"><div class="chip" style="background:#00B8A0"></div><div class="meta"><div class="name">Primary · Teal</div><div class="hex">#00B8A0</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FFB347"></div><div class="meta"><div class="name">Accent · Amber</div><div class="hex">#FFB347</div></div></div>
  <div class="swatch"><div class="chip" style="background:#5DD67A"></div><div class="meta"><div class="name">Healthy · Green</div><div class="hex">#5DD67A</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FFC940"></div><div class="meta"><div class="name">Warning · Yellow</div><div class="hex">#FFC940</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FF6B6B"></div><div class="meta"><div class="name">Risk · Coral</div><div class="hex">#FF6B6B</div></div></div>
</div>
</div></body></html>
