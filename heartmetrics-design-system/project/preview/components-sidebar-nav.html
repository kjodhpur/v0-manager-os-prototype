<!doctype html><html><head><meta charset="utf-8">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono',Monaco,monospace}
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .split{display:grid;grid-template-columns:1fr 1fr;min-height:360px}
  .pane{padding:16px;position:relative}
  .dark{background:#020807;color:#EAF4F1;border-right:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}
  .tag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:10px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
  .item+.item{margin-top:2px}
  i{width:16px;height:16px;stroke-width:2}

  .dark .item{color:#8FB3AC}
  .dark .item i{color:#6B8A84}
  .dark .item:hover{background:#0A1A18;color:#EAF4F1}
  .dark .item:hover i{color:#EAF4F1}
  .dark .active{background:linear-gradient(90deg,rgba(0,184,160,0.18) 0%,rgba(0,184,160,0.06) 100%);color:#14E3CE;position:relative;box-shadow:inset 0 0 0 1px rgba(0,184,160,0.2)}
  .dark .active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(180deg,#14E3CE,#34D98B);box-shadow:0 0 8px rgba(0,209,193,0.6)}
  .dark .active i{color:#14E3CE;filter:drop-shadow(0 0 4px rgba(0,209,193,0.5))}

  .light .item{color:#7A8C88}
  .light .item i{color:#9AA8A4}
  .light .item:hover{background:#F0F0E6;color:#0F2420}
  .light .item:hover i{color:#0F2420}
  .light .active{background:linear-gradient(90deg,rgba(0,184,160,0.14) 0%,rgba(0,184,160,0.04) 100%);color:#00806F;position:relative;box-shadow:inset 0 0 0 1px rgba(0,128,111,0.2)}
  .light .active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(180deg,#00B8A0,#2DA069)}
  .light .active i{color:#00806F}
</style></head>
<body>
<div class="split">
  <div class="pane dark">
    <div class="tag">Dark</div>
    <div class="item active"><i data-lucide="layout-dashboard"></i>Overview</div>
    <div class="item"><i data-lucide="sparkles"></i>AI Coach</div>
    <div class="item"><i data-lucide="heart-pulse"></i>Team Health</div>
    <div class="item"><i data-lucide="flame"></i>Burnout Risk</div>
    <div class="item"><i data-lucide="bar-chart-3"></i>Work Distribution</div>
    <div class="item"><i data-lucide="award"></i>Recognition</div>
  </div>
  <div class="pane light">
    <div class="tag">Light</div>
    <div class="item active"><i data-lucide="layout-dashboard"></i>Overview</div>
    <div class="item"><i data-lucide="sparkles"></i>AI Coach</div>
    <div class="item"><i data-lucide="heart-pulse"></i>Team Health</div>
    <div class="item"><i data-lucide="flame"></i>Burnout Risk</div>
    <div class="item"><i data-lucide="bar-chart-3"></i>Work Distribution</div>
    <div class="item"><i data-lucide="award"></i>Recognition</div>
  </div>
</div>
<script>lucide.createIcons()</script>
</body></html>
