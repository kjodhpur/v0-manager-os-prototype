<!doctype html><html><head><meta charset="utf-8">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --serif: Georgia, 'Palatino', 'Times New Roman', serif;
    --mono: 'SF Mono', Monaco, monospace;
  }
  html,body{margin:0;padding:0;font-family:var(--sans)}
  .row{padding:16px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;align-items:stretch}
  .dark{background:#020807;color:#EAF4F1;border-bottom:1px solid #132421}
  .light{background:#FAF8F5;color:#0F2420}
  .tag{position:absolute;top:6px;left:22px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px;border-radius:4px}
  .dark .tag{background:#0A1A18;color:#8FB3AC;border:1px solid #132421}
  .light .tag{background:#EAF4F1;color:#7A8C88;border:1px solid #DAD3C7}

  .kpi{border-radius:10px;padding:12px 14px;margin-top:14px}
  .dark .kpi{border:1px solid #132421;background:#050D0C}
  .light .kpi{border:1px solid #DAD3C7;background:#fff}

  .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
  .dark .lbl{color:#8FB3AC}
  .light .lbl{color:#7A8C88}

  .num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1;margin-top:6px;display:flex;align-items:baseline;gap:6px}
  .delta{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:2px}
  .dark .up{color:#34D98B}
  .dark .down{color:#D96B6B}
  .light .up{color:#2DA069}
  .light .down{color:#C85858}

  .sub{font-size:10px;margin-top:4px}
  .dark .sub{color:#6B8A84}
  .light .sub{color:#7A8C88}
  .dark .warn{color:#E2BC57}
  .light .warn{color:#A67A1E}
  [data-lucide]{width:10px;height:10px;stroke-width:2}

  .kpi.brand .num{
    background:linear-gradient(90deg,#00D1C1 0%,#34D98B 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .light .kpi.brand .num{
    background:linear-gradient(90deg,#00806F 0%,#2DA069 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
</style></head>
<body>

<div class="row dark">
  <span class="tag">Dark</span>
  <div class="kpi brand"><div class="lbl">Team WHI</div><div class="num">62 <span class="delta up"><i data-lucide="trending-up"></i>+3</span></div><div class="sub">4-week average</div></div>
  <div class="kpi"><div class="lbl">High Risk</div><div class="num">3</div><div class="sub warn">Need attention</div></div>
  <div class="kpi"><div class="lbl">Blocked</div><div class="num">12</div><div class="sub">Active blockers</div></div>
  <div class="kpi"><div class="lbl">Fairness</div><div class="num">71 <span class="delta down"><i data-lucide="trending-down"></i>−4</span></div><div class="sub">Confidence: high</div></div>
</div>

<div class="row light">
  <span class="tag">Light</span>
  <div class="kpi brand"><div class="lbl">Team WHI</div><div class="num">62 <span class="delta up"><i data-lucide="trending-up"></i>+3</span></div><div class="sub">4-week average</div></div>
  <div class="kpi"><div class="lbl">High Risk</div><div class="num">3</div><div class="sub warn">Need attention</div></div>
  <div class="kpi"><div class="lbl">Blocked</div><div class="num">12</div><div class="sub">Active blockers</div></div>
  <div class="kpi"><div class="lbl">Fairness</div><div class="num">71 <span class="delta down"><i data-lucide="trending-down"></i>−4</span></div><div class="sub">Confidence: high</div></div>
</div>

<script>lucide.createIcons()</script>
</body></html>
