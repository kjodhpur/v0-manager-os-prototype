<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00B8A0"/>
      <stop offset="40%" stop-color="#5DD67A"/>
      <stop offset="80%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <filter id="darkGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#darkGlow)">
    <text x="50%" y="55" fill="url(#darkGrad)" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif"
          font-weight="300" font-size="38" letter-spacing="1.5">
      heartmetrics
    </text>
  </g>
</svg>
